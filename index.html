    <header class="site-header">
      <a class="brand" href="#" aria-label="Atlas Quest asset viewer home">
        <span class="brand-mark" aria-hidden="true">AQ</span>
        <span>
          <strong>Atlas Quest</strong>
          <small>Asset viewer</small>
        </span>
      </a>

      <div class="header-actions">
        <span class="asset-count" id="assetCount">01 / 75</span>
        <button
          class="icon-button audio-toggle"
          id="muteButton"
          type="button"
          aria-pressed="false"
          aria-label="Mute all Atlas Quest audio"
          title="Mute all Atlas Quest audio"
        >
          <span class="audio-toggle-icon" aria-hidden="true">🔊</span>
          <span class="button-label">Mute audio</span>
        </button>
        <button class="icon-button" id="fitButton" type="button" aria-pressed="false" title="Show image at full size">
          <span aria-hidden="true">↗</span>
          <span class="button-label">Full size</span>
        </button>
      </div>
    </header>
